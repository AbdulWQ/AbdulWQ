    <g transform="translate(462 72)"><rect width="190" height="128" rx="14" fill="#161b22" stroke="#8957e5"/><circle cx="30" cy="31" r="13" fill="#8957e5"/><text x="54" y="38" fill="#f0f6fc" font-size="18" font-weight="700">Interfaces</text><text x="20" y="76" fill="#8b949e" font-size="15">SPI · ADC · GPIO</text><text x="20" y="101" fill="#8b949e" font-size="15">Displays · sensors</text></g>
    <g transform="translate(674 72)"><rect width="188" height="128" rx="14" fill="#161b22" stroke="#d29922"/><circle cx="30" cy="31" r="13" fill="#d29922"/><text x="54" y="38" fill="#f0f6fc" font-size="18" font-weight="700">Workflow</text><text x="20" y="76" fill="#8b949e" font-size="15">CMake · west</text><text x="20" y="101" fill="#8b949e" font-size="15">Git · ST-Link</text></g>
